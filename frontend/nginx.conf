# Re-resolve the backend's address at runtime, so recreating the backend container does not
# leave nginx pinned to an address nothing answers on. `server ... resolve` needs
# nginx >= 1.27.3; the runtime image ships well past that.
#
# This file is rendered through the stock nginx image's envsubst step (it is installed as
# /etc/nginx/templates/default.conf.template), so the brace-wrapped placeholder below is
# substituted at container start. nginx's own $host/$uri variables are untouched: the step
# substitutes only names that are defined in the environment. Deliberately no literal
# placeholder syntax in these comments, so that grepping the RENDERED config for one is a
# clean check that every substitution actually happened.
#
# The resolver is read from /etc/resolv.conf rather than hardcoded to 127.0.0.11 (#448).
# `server ... resolve` makes nginx re-resolve the backend at runtime through its OWN resolver
# directive — it never consults /etc/hosts or the system resolver — so whatever address is
# named here must actually answer. 127.0.0.11 is Docker's embedded DNS and exists only on a
# user-defined Docker network. On Podman (DNS on the network gateway), Kubernetes (cluster
# DNS) or any other runtime it is simply absent: every resolve got "connection refused",
# every /api/ proxy failed, and users could not log in after upgrading to 3.4.x, while
# downgrading only the frontend image fixed it. NGINX_LOCAL_RESOLVERS is populated by the
# image's 15-local-resolvers.envsh from the container's real resolv.conf, which is correct on
# every runtime, and falls back to 127.0.0.11 (see resolver-default.envsh) if that file names
# no nameserver at all.
upstream mailflow_api {
    zone mailflow_api 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 5s;
    server backend:3000 resolve;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP: tighten as needed. 'unsafe-inline' styles are required by the React
    # app (inline style props). Email images load from arbitrary https origins.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: https:; img-src 'self' data: https: blob:; connect-src 'self' wss:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # OAuth proxy
    location /oauth/ {
        proxy_pass         http://mailflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # OIDC browser redirect flows (start + callback)
    location /auth/oidc/ {
        proxy_pass         http://mailflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Long-running API operations (rules run iterates all inbox messages via IMAP)
    location = /api/rules/run {
        proxy_pass         http://mailflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # AI streaming endpoints — long timeout, no buffering (SSE)
    location /api/ai/ {
        proxy_pass             http://mailflow_api;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     300s;
        proxy_buffering        off;
        proxy_cache            off;
    }

    # API proxy
    location /api/ {
        proxy_pass         http://mailflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass         http://mailflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — never cache HTML so browsers always get current JS filenames
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # Re-declare security headers (add_header in child blocks overrides parent)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: https:; img-src 'self' data: https: blob:; connect-src 'self' wss:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;
    }

    # Service worker must never be cached — it controls push notifications and needs
    # to update immediately when deployed. Exact-match takes precedence over the
    # regex below, so /sw.js bypasses the 1-year immutable rule.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: https:; img-src 'self' data: https: blob:; connect-src 'self' wss:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;
    }

    # Cache static assets — no security headers needed on immutable assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# HTTP server — serves the app directly on port 80.
# Intended for deployments behind a reverse proxy that terminates TLS upstream.
# When the upstream proxy sets X-Forwarded-Proto: https, Express marks the
# connection as secure and issues Secure cookies as normal.
server {
    listen 80;
    server_name _;

    # Security headers — HSTS is intentionally omitted here; it must only be
    # sent over HTTPS and belongs on the TLS-terminating proxy instead.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data: https:; img-src 'self' data: https: blob:; connect-src 'self' wss: ws:; frame-src 'self'; object-src 'none'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

